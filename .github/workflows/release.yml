# Builds every program and, for a version tag (v*), publishes a GitHub Release.
# Manual runs (Actions tab -> Release -> Run workflow) build and upload
# artifacts without publishing a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.16.0 # keep in step with browser/go.mod
  # Stamped into every program (main.version): the tag for releases, else dev-<commit>.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  tools:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile command-line tools
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { # goos goarch program
            local ext=""; [ "$1" = windows ] && ext=".exe"
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/$3-$1-$2$ext" "./cmd/$3"
          }
          build windows amd64 hi-hostagent
          build windows amd64 hi-directory
          build linux   amd64 hi-directory
          build linux   arm64 hi-directory
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: tools
          path: dist/*

  # Host package: hi-hostagent.exe, the host-control DLL and its loader, plus
  # example configs, in one zip. The DLL is built with the runner's MSVC x64
  # tools (native/hostctl/vcvars.cmd finds them) and a static C runtime.
  host-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build DLL and loader
        shell: cmd
        run: call native\hostctl\build.cmd "%GITHUB_WORKSPACE%\native-out"
      - name: Native tests
        shell: cmd
        run: |
          for %%t in (slot provider mailbox image choice snapshot backend) do (
            call native\hostctl\test-%%t.cmd "%GITHUB_WORKSPACE%\native-tests\%%t" || exit /b 1
          )
      - name: DLL-backed Go tests
        shell: pwsh
        run: |
          $env:HOSTCTL_TEST_DLL = "$env:GITHUB_WORKSPACE\native-out\hi-hostctl.dll"
          $env:HOSTCTL_TEST_HARNESS = "$env:GITHUB_WORKSPACE\native-out\hostctl-harness.exe"
          go test -count=1 ./internal/hostctl/
      - name: Package
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory host | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$env:VERSION" -o host\hi-hostagent.exe ./cmd/hi-hostagent
          Copy-Item native-out\hi-hostctl.dll, native-out\hostctl-loader.exe host\
          Copy-Item packaging\host\* host\
          Compress-Archive -Path host\* -DestinationPath OpenLink-host-windows-amd64.zip
          Get-ChildItem host | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: host-windows
          path: OpenLink-host-windows-amd64.zip

  browser-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: browser/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Type-check frontend
        working-directory: browser/frontend
        run: |
          npm ci
          npm run check
      - run: wails build -clean -platform windows/amd64 -o OpenLink-windows-amd64.exe -ldflags "-X main.version=$env:VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-windows
          path: browser/build/bin/OpenLink-windows-amd64.exe

  # Experimental: the Linux app has not been tested yet. A failure here does
  # not block the release.
  browser-linux:
    needs: test
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: browser/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - run: wails build -clean -platform linux/amd64 -tags webkit2_41 -o OpenLink-linux-amd64 -ldflags "-X main.version=$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-linux
          path: browser/build/bin/OpenLink-linux-amd64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tools, host-windows, browser-windows, browser-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
