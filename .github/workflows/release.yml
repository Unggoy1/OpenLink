# Builds the programs and, for a version tag (v*), publishes a GitHub Release.
# Manual runs (Actions tab -> Release -> Run workflow) build and upload
# artifacts without publishing a release.
#
# All programs share one tag series, but a release carries the OpenLink app
# and OpenLink Server only when something they are built from changed since
# the last release that carried them (the plan job). The app's update check
# and the website look for the newest release with each program's file, so a
# server-only release never asks players to update. Override the choice with
# [app] / [no-app] and [server] / [no-server] in the annotated tag's message,
# or with the inputs of a manual run on the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      app:
        description: "Build the OpenLink app (auto: on a tag, only if it changed since the last release with the app)"
        type: choice
        options: ["auto", "yes", "no"]
        default: "auto"
      server:
        description: "Build OpenLink Server (auto: on a tag, only if it changed since the last release with the server)"
        type: choice
        options: ["auto", "yes", "no"]
        default: "auto"

permissions:
  contents: read

env:
  WAILS_VERSION: v2.16.0 # keep in step with browser/go.mod
  # Stamped into every program (main.version): the tag for releases, else dev-<commit>.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
  APP_ASSET: OpenLink-windows-amd64.exe # keep in step with internal/release
  SERVER_ASSET: OpenLink-Server-windows-amd64.zip

jobs:
  # Decides which programs this run builds, and the release's name and notes.
  plan:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.plan.outputs.app }}
      server: ${{ steps.plan.outputs.server }}
      name: ${{ steps.plan.outputs.name }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_SERVER: ${{ inputs.server }}
        run: |
          set -euo pipefail
          tag=""; tag_msg=""; releases="[]"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
            git fetch --force origin "$GITHUB_REF:$GITHUB_REF" # keep the annotated tag's message
            tag_msg=$(git for-each-ref "$GITHUB_REF" --format='%(contents)')
            releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50")
          fi
          # last_with FILE: the newest published release, other than this one, that carries FILE.
          last_with() {
            jq -r --arg a "$1" --arg t "$tag" \
              '[.[] | select((.draft | not) and .tag_name != $t and any(.assets[]; .name == $a))][0].tag_name // ""' <<<"$releases"
          }
          # src_files MODULE_DIR PACKAGE GOOS: the repo's source files a Go program
          # compiles (files, not folders, so a shared package's other files do not count).
          src_files() {
            (cd "$1" && GOOS=$3 go list -e -deps -f \
              '{{if not .Standard}}{{$d := .Dir}}{{range .GoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .CgoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .EmbedFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{end}}' \
              "$2") | sed -n "s#^$PWD/##p"
          }
          # decide NAME INPUT FILE PATHS...: sets NAME=true|false and last_NAME.
          decide() {
            local name=$1 input=$2 file=$3 build why last=""
            shift 3
            if [[ "$input" == yes || "$input" == no ]]; then
              build=$([[ "$input" == yes ]] && echo true || echo false); why="manual run input"
            elif grep -qF "[no-$name]" <<<"$tag_msg"; then
              build=false; why="tag message says [no-$name]"
            elif grep -qF "[$name]" <<<"$tag_msg"; then
              build=true; why="tag message says [$name]"
            elif [[ -z "$tag" ]]; then
              build=true; why="not a release: build everything"
            else
              last=$(last_with "$file")
              if [[ -z "$last" ]] || ! git rev-parse -q --verify "refs/tags/$last" >/dev/null; then
                build=true; why="no earlier release carries it"
              elif git diff --quiet "$last" HEAD -- "$@"; then
                build=false; why="unchanged since $last"
              else
                build=true; why="changed since $last"
              fi
            fi
            [[ "$build" == true ]] || last=${last:-$(last_with "$file")}
            echo "$name: $build ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$name=$build" >>"$GITHUB_OUTPUT"
            printf -v "build_$name" '%s' "$build"
            printf -v "last_$name" '%s' "$last"
          }
          mapfile -t app_paths < <({ src_files browser . windows; src_files browser . linux; } | sort -u)
          mapfile -t server_paths < <(src_files . ./cmd/openlink-server windows | sort -u)
          printf '%s\n' "app inputs outside browser/:" "${app_paths[@]}" | grep -v '^browser/'
          decide app "${INPUT_APP:-auto}" "$APP_ASSET" browser go.mod go.sum "${app_paths[@]}"
          decide server "${INPUT_SERVER:-auto}" "$SERVER_ASSET" native packaging/host go.mod go.sum "${server_paths[@]}"

          name=$tag; notes=""
          case "$build_app,$build_server" in
            true,false) name="$tag · OpenLink app" ;;
            false,true) name="$tag · OpenLink Server" ;;
            false,false) name="$tag · OpenLink Directory" ;;
          esac
          [[ "$build_app" == true ]] || notes+="**OpenLink app:** unchanged in this release${last_app:+, the current version is $last_app}. Players do not need to update."$'\n\n'
          [[ "$build_server" == true ]] || notes+="**OpenLink Server:** unchanged in this release${last_server:+, the current version is $last_server}. Hosts do not need to update."$'\n\n'
          echo "name=$name" >>"$GITHUB_OUTPUT"
          { echo "notes<<EOF_NOTES"; printf '%s' "$notes"; echo; echo "EOF_NOTES"; } >>"$GITHUB_OUTPUT"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  tools:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cross-compile command-line tools
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { # goos goarch program
            local ext=""; [ "$1" = windows ] && ext=".exe"
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/$3-$1-$2$ext" "./cmd/$3"
          }
          build windows amd64 openlink-directory
          build linux   amd64 openlink-directory
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tools
          path: dist/*

  # OpenLink Server package: openlink-server.exe, openlink-control.dll and
  # openlink-loader.exe plus example configs, in one zip, and the experimental
  # Steam-free steam_api64.dll in steam-free\. The DLLs are built with the runner's
  # MSVC x64 tools (native/hostctl/vcvars.cmd finds them) and a static C runtime.
  host-windows:
    needs: [test, plan]
    if: needs.plan.outputs.server == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build DLL and loader
        shell: cmd
        run: call native\hostctl\build.cmd "%GITHUB_WORKSPACE%\native-out"
      - name: Native tests
        shell: cmd
        run: |
          for %%t in (slot provider mailbox image choice snapshot backend beacon team bots) do (
            call native\hostctl\test-%%t.cmd "%GITHUB_WORKSPACE%\native-tests\%%t" || exit /b 1
          )
      - name: Build and test the Steam-free DLL
        shell: cmd
        run: call native\steamfree\test.cmd "%GITHUB_WORKSPACE%\native-out\steamfree"
      - name: DLL-backed Go tests
        shell: pwsh
        run: |
          $env:HOSTCTL_TEST_DLL = "$env:GITHUB_WORKSPACE\native-out\openlink-control.dll"
          $env:HOSTCTL_TEST_HARNESS = "$env:GITHUB_WORKSPACE\native-out\hostctl-harness.exe"
          go test -count=1 ./internal/hostctl/
      - name: Package
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory host | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$env:VERSION" -o host\openlink-server.exe ./cmd/openlink-server
          Copy-Item native-out\openlink-control.dll, native-out\openlink-loader.exe host\
          New-Item -ItemType Directory host\steam-free | Out-Null
          Copy-Item native-out\steamfree\steam_api64.dll host\steam-free\
          Copy-Item packaging\host\* host\
          Compress-Archive -Path host\* -DestinationPath OpenLink-Server-windows-amd64.zip
          Get-ChildItem -Recurse -File host | Format-Table FullName, Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-windows
          path: OpenLink-Server-windows-amd64.zip

  browser-windows:
    needs: [test, plan]
    if: needs.plan.outputs.app == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: browser/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Type-check frontend
        working-directory: browser/frontend
        run: |
          npm ci
          npm run check
      - run: wails build -clean -platform windows/amd64 -o OpenLink-windows-amd64.exe -ldflags "-X main.version=$env:VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-windows
          path: browser/build/bin/OpenLink-windows-amd64.exe

  # Experimental: the Linux app has not been tested yet. A failure here does
  # not block the release.
  browser-linux:
    needs: [test, plan]
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: browser/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - run: wails build -clean -platform linux/amd64 -tags webkit2_41 -o OpenLink-linux-amd64 -ldflags "-X main.version=$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-linux
          path: browser/build/bin/OpenLink-linux-amd64

  # Runs when the planned builds succeeded; programs the plan left out are
  # skipped jobs, which must not stop the release.
  release:
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [plan, tools, host-windows, browser-windows, browser-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          name: ${{ needs.plan.outputs.name }}
          body: ${{ needs.plan.outputs.notes }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
